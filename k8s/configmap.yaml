apiVersion: v1
kind: ConfigMap
metadata:
  name: laravel-config
data:
  APP_NAME: "LaravelThreeTier"
  APP_ENV: "production"
  APP_DEBUG: "false"
  LOG_CHANNEL: "stderr"
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_DATABASE: "laravel_db"
  DB_USERNAME: "laravel_user"
  SESSION_DRIVER: "file"
  CACHE_STORE: "file"
  CACHE_DRIVER: "file"
  QUEUE_CONNECTION: "sync"
